name: Build NFCARD IPA

on:
  push:
    branches:
      - main
      - temp/icon-green-theme
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfcard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

    steps:
      - name: Xcode 26.2 setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version

      - name: Materialize NFCARD icon asset
        if: github.ref == 'refs/heads/temp/icon-green-theme'
        shell: bash
        run: |
          set -euxo pipefail
          ICON=Assets/NFCARDIconSource.jpg
          if [ ! -s "$ICON" ]; then
            mkdir -p Assets
            curl -fL --retry 3 \
              'https://d2ol7oe51mr4n9.cloudfront.net/user_3JA62RTSWrerhK4O20lVs9K7hJj/a068807b-c621-4558-b3e5-234a0e3a06b0.jpg' \
              -o "$ICON"
            echo '711861b3abd615dd5e8b008cbb963c7cf1bbcf44b3eb70c3dc019413fb8bdeed  Assets/NFCARDIconSource.jpg' | shasum -a 256 -c -
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$ICON"
            git commit -m 'assets: add supplied NFCARD app icon'
            git push origin HEAD:temp/icon-green-theme
          fi

      - name: Restore patched AirliftFFI cache
        uses: actions/cache@v4
        with:
          path: .build/cache/airlift-ffi
          key: nfcard-airlift-macos26-xcode26.2-097a058-rp-v2
          restore-keys: |
            nfcard-airlift-macos26-xcode26.2-097a058-

      - name: Build NFCARD IPA
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .build
          bash scripts/build.sh 2>&1 | tee .build/nfcard-build.log

      - name: Verify artifact
        shell: bash
        run: |
          set -euxo pipefail
          IPA=.build/NFCARD-unsigned.ipa
          test -s "$IPA"
          unzip -tq "$IPA"
          test -s .build/NFCARD-SHA256.txt
          grep -Fq '097a058c984ffc33ccb697b9dfe8058be3e86244' scripts/build.sh
          grep -Fq 'NFCARDPairingTab()' scripts/patch-upstream.py
          grep -Fq 'NFCARDWalletCardsTab()' scripts/patch-upstream.py
          grep -Fq 'AirCardLibraryView(onExit:' scripts/patch-upstream.py
          grep -Fq 'Back to NFCARD' Sources/AirCardLibrary.swift
          ! grep -Fq 'FilzaAirCard' Sources/AirCardLibrary.swift
          du -h "$IPA"
          cat .build/NFCARD-SHA256.txt

      - name: Upload unsigned NFCARD IPA
        uses: actions/upload-artifact@v4
        with:
          name: NFCARD-unsigned
          path: |
            .build/NFCARD-unsigned.ipa
            .build/NFCARD-SHA256.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFCARD-build-log-${{ github.run_id }}
          path: .build/nfcard-build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Publish rolling NFCARD release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG=NFCARD-latest

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

          cat > .build/release-notes.md <<'EOF'
          Rolling unsigned NFCARD development build.

          Assets:
          - `NFCARD-unsigned.ipa`
          - `NFCARD-SHA256.txt`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "NFCARD Latest"               --notes-file .build/release-notes.md
          else
            gh release create "$TAG"               --title "NFCARD Latest"               --notes-file .build/release-notes.md
          fi

          gh release upload "$TAG"             .build/NFCARD-unsigned.ipa             .build/NFCARD-SHA256.txt             --clobber
